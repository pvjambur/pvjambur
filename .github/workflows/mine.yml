name: Re-mine profile

on:
  schedule:
    - cron: "23 1,13 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - docs/art.js
      - .github/workflows/mine.yml

permissions:
  contents: write

concurrency:
  group: mine
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull contributions and redraw
        run: node scripts/build.mjs
        env:
          # PROFILE_TOKEN is optional: a classic token with read:user lets private
          # contributions count toward the totals. GITHUB_TOKEN covers public data.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name "mine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to mine"
          else
            git commit -m "Re-mine profile stats"
            git push
          fi
